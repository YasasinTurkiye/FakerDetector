name: Release
on:
  push:
    branches: [main]
    paths: [VERSION, FakerDetector.exe]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish FakerDetector.exe as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" FakerDetector.exe --clobber
          else
            gh release create "v$v" FakerDetector.exe --title "FakerDetector $v" --latest \
              --notes "Download **FakerDetector.exe** below and run it on the player's PC while they are connected to the server in Minecraft. It asks for administrator rights. Made by turkicc."
          fi
